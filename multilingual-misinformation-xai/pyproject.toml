[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "multilingual-misinformation-xai"
version = "0.1.0"
description = "Reproducible claim classification research with dataset-aware limitations and explainability."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { text = "MIT" }
dependencies = [
  "numpy>=2.1,<3",
  "pandas>=2.2,<4",
  "scikit-learn>=1.6,<2",
  "joblib>=1.4,<2",
  "streamlit>=1.45,<2",
  "plotly>=6,<7",
  "matplotlib>=3.9,<4",
  "certifi>=2025.1",
]

[project.optional-dependencies]
afrifact = ["datasets>=3.3,<5", "huggingface-hub>=0.29,<2"]
transformer = [
  "torch>=2.6,<3",
  "transformers>=4.49,<6",
  "accelerate>=1.4,<2",
  "datasets>=3.3,<5",
]
explainability = ["captum>=0.7,<1"]
dev = ["pytest>=8.3,<9", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
